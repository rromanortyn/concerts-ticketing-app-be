name: concerts-ticketing-app

services:
  postgres:
    build:
      context: ..
      dockerfile: docker/postgres/Dockerfile
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_DB=${DATABASE_NAME}
    container_name: concerts-ticketing-app-postgres
    ports:
      - ${DATABASE_PORT_OUTER}:${DATABASE_PORT_INNER}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - default

  minio:
    build:
      context: ..
      dockerfile: docker/minio/Dockerfile
    restart: always
    ports:
      - ${MINIO_PORT_OUTER}:${MINIO_PORT_INNER}
      - ${MINIO_CONSOLE_PORT_OUTER}:${MINIO_CONSOLE_PORT_INNER}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_HOST_INNER: ${MINIO_HOST_INNER}
      MINIO_PORT_INNER: ${MINIO_PORT_INNER}
    container_name: concerts-ticketing-app-minio
    entrypoint: ["/bin/sh", "-c", "/usr/local/bin/entrypoint.sh"]
    volumes:
      - minio-data:/data
    networks:
      - default

volumes:
  db-data:
  minio-data:

networks:
  default:
    name: concerts-ticketing-app-network
